# Run automatically on `git commit` after `pre-commit install`.
# See https://pre-commit.com
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17  # keep in sync with the ruff pin in .github/workflows/ci.yml
    hooks:
      - id: ruff
        args: [--fix]
      # No ruff-format hook: the codebase is not ruff-format clean (26 files
      # would be reformatted), and CI only runs `ruff check`. Add it back only
      # alongside a one-off repo-wide format commit.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key

  # detect-private-key only matches PEM headers -- it would not have caught
  # the plaintext Neo4j password once committed to GAPS.md (see GAPS #1).
  # gitleaks scans staged changes for passwords/tokens/API keys.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
