name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # The heavy ML libraries (torch, sentence-transformers, faiss, arango,
        # datasets) are imported lazily, so unit tests need only this light set.
        # fastapi/httpx are needed to test backend/main.py's TestClient; mcp is
        # needed to import backend/mcp_server.py (mounted at /mcp).
        # ruff is pinned to match .pre-commit-config.yaml's ruff-pre-commit rev.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn scipy requests pytest pytest-cov "ruff==0.15.17" fastapi httpx "mcp>=1.24,<2"

      - name: Lint (ruff)
        run: |
          ruff check --diff --fix tests/integration/test_graph_db_contract.py
          ruff format --diff tests/integration/test_graph_db_contract.py
          ruff check src scripts tests app backend
          ruff format --check src scripts tests app backend

      - name: Eval regression gate
        # Blocks the build if results/summary.json (what the /benchmark page and
        # dashboard read directly, and RESULTS.md / README are hand-copied from)
        # is ever edited down or regresses -- see tests/test_results_regression.py
        # for why this doesn't re-run the LLM benchmark itself (needs GPU + ArangoDB).
        run: pytest tests/test_results_regression.py -v

      - name: Test (pytest)
        run: pytest --cov=kgqa --cov=graphrag --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Build (static-generates /benchmark from ../results/summary.json)
        run: npm run build
