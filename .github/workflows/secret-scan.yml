name: Secret scan

# The existing local pre-commit hook catches staged secrets, but CI must
# protect contributors who haven't installed pre-commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan checked-in files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan current checkout with Gitleaks
        # Scan the working tree, not the entire historical commit graph:
        # an old Neo4j password was committed and later redacted, so a full
        # history scan would remain red until that incident is remediated.
        # The historical credential MUST still be rotated in Neo4j AuraDB.
        # --redact keeps detected values out of publicly visible CI logs.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --no-banner --redact --exit-code 1 /repo
